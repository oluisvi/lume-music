<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#11100f" />
  <meta name="description" content="Lume — a história de um instrumento, do primeiro olhar ao primeiro acorde." />
  <title>Lume — a música avança com você</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html{scroll-behavior:auto}
    body{background:#11100f;color:#eee9df}
    .topbar{position:fixed;z-index:10;background:linear-gradient(#080a0ac9,transparent);border:0}
    .journey{height:500vh;position:relative}
    .sticky{height:100svh;min-height:520px;position:sticky;top:0;overflow:hidden;background:#121210 url("hero-still.png") center/cover no-repeat}
    .visual,.visual video,.visual:after{position:absolute;inset:0}
    .visual video{width:100%;height:100%;object-fit:cover;filter:brightness(.52)}
    .visual:after{content:"";background:linear-gradient(90deg,#090b0be0 0%,#090b0b82 54%,#090b0b20 100%),linear-gradient(0deg,#090b0bc0,transparent 38%)}
    .hud{position:absolute;z-index:2;inset:0;padding:15vh var(--gutter) 10vh;display:flex;flex-direction:column;justify-content:center;pointer-events:none}
    .hud small,.counter,.cue{font:10px "DM Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#eee9df}
    .hud small{color:#e9b36e}
    .hud h1{font:500 clamp(64px,10vw,142px)/.88 "Playfair Display",serif;letter-spacing:-.05em;max-width:950px;margin:25px 0;color:#eee9df;transition:opacity .24s ease,transform .24s ease}
    .hud h1 em{color:#e9b36e;font-weight:500}
    .hud h1 .title-accent{color:#e9b36e}
    .hud h1 .title-rest{color:#eee9df}
    .hud>p:not(.media-status){font:15px/1.75 "DM Sans",sans-serif;color:#e0dcd5;max-width:390px;margin:0;transition:opacity .24s ease,transform .24s ease}
    .hud.is-changing h1,.hud.is-changing p{opacity:0;transform:translateY(8px)}
    .hud .media-status{position:absolute;left:var(--gutter);top:calc(100% - 88px);max-width:min(390px,calc(100% - 48px));padding:12px 15px;background:#090b0be8;color:#e0dcd5;font:12px/1.6 "DM Sans",sans-serif;opacity:0;pointer-events:none;transition:opacity .25s}
    .visual.video-unavailable .media-status{opacity:1}
    .visual.video-unavailable video{display:none}
    .visual.video-unavailable:after{background:linear-gradient(90deg,#090b0bed 0%,#090b0b9e 62%,#090b0b4c 100%),linear-gradient(0deg,#090b0bc0,transparent 38%)}
    .visual.video-unavailable ~ .hud .cue{display:none}
    .counter,.cue{position:absolute;bottom:38px}
    .counter{left:var(--gutter)}.cue{right:var(--gutter)}
    .progress{position:absolute;z-index:4;top:0;left:0;width:100%;height:3px;background:#d8944b;transform:scaleX(0);transform-origin:left}
    .chapters{position:relative;z-index:3;background:#eee9df;color:#191715;padding:3px var(--gutter) 9vh}
    .chapters article{min-height:70vh;padding:12vh 0;display:flex;flex-direction:column;justify-content:center;max-width:730px;border-bottom:1px solid #19171524}
    .chapters article:nth-child(even){margin-left:auto;text-align:right;align-items:flex-end}
    .chapters small{font:10px "DM Mono",monospace;letter-spacing:.16em;color:#a56536}
    .chapters h2{font:500 clamp(47px,7.4vw,94px)/.94 "Playfair Display",serif;letter-spacing:-.04em;margin:22px 0}
    .chapters p{font:15px/1.75 "DM Sans",sans-serif;max-width:430px;color:#615c53}
    .chapters a{margin-top:16px;color:#191715;font:10px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #191715;padding:12px 0}
    .topbar nav a:focus-visible,.topbar a:focus-visible,.chapters a:focus-visible{outline:2px solid #e9b36e;outline-offset:5px}
    .journey:focus-visible{outline:2px solid #e9b36e;outline-offset:-4px}
    @media(max-width:650px){.journey{height:420vh}.hud{padding:16vh 24px 9vh}.hud h1{font-size:clamp(59px,14vw,78px)}.hud p{max-width:310px;font-size:14px}.counter,.cue{bottom:25px;font-size:8px}.chapters article{min-height:60vh}.chapters article:nth-child(even){text-align:left;align-items:flex-start}}
    @media(prefers-reduced-motion:reduce){.journey{height:auto}.sticky{height:100svh;position:relative}.visual video{display:none}.progress{display:none}.cue{display:none}.chapters{padding-top:5vh}.chapters article{min-height:0;padding:9vh 0}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">LUME<span>♫</span></a>
    <nav aria-label="Navegação da experiência"><a href="index.html#case">Sobre o conceito</a></nav>
    <a class="bag" href="index.html">Voltar à loja ↗</a>
  </header>
  <main>
    <section class="journey" id="journey" aria-label="Vídeo narrativo da Lume controlado pelo scroll">
      <div class="sticky">
        <div class="progress" id="progress"></div>
        <div class="visual" aria-hidden="true">
          <video id="storyVideo" muted playsinline preload="metadata" poster="hero-still.png" aria-hidden="true">
            <source src="media/lume-story.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="hud">
          <small id="kicker">01 / ABERTURA</small>
          <h1 id="title" aria-live="polite">Um som chama<br /><em>outro.</em></h1>
          <p id="copy">A guitarra encontra espaço antes da primeira nota.</p>
          <p class="media-status" role="status">O take da guitarra não pôde ser carregado. A imagem de abertura continua disponível enquanto você lê os capítulos.</p>
          <div class="counter" id="counter">01 — 04</div>
          <div class="cue">Role para avançar a cena ↓</div>
        </div>
      </div>
    </section>
    <section class="chapters" id="chapters" aria-label="Capítulos da história"></section>
  </main>
  <script>
    const scenes=[
      {n:"01",title:"Um som chama outro.",accent:"outro.",copy:"A performance abre a história pelo instrumento e pelo gesto."},
      {n:"02",title:"A primeira nota aparece.",accent:"aparece.",copy:"Os dedos encontram as cordas e a execução ocupa a sala."},
      {n:"03",title:"O ritmo toma forma.",accent:"forma.",copy:"A frase musical se repete e ganha intenção ao longo da performance."},
      {n:"04",title:"A música fica no ar.",copy:"O take termina; a próxima ideia pode começar com o instrumento certo."}
    ];
    const journey=document.querySelector("#journey"),video=document.querySelector("#storyVideo"),visual=document.querySelector(".visual"),hud=document.querySelector(".hud"),chapters=document.querySelector("#chapters"),reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
    scenes.forEach((scene,i)=>{const article=document.createElement("article");article.innerHTML="<small>"+scene.n+" / CAPÍTULO</small><h2>"+scene.title+"</h2><p>"+scene.copy+"</p>"+(i===3?'<a href="index.html#instrumentos">ENCONTRE SEU SOM ↗</a>':"");chapters.append(article)});
    let raf=0,lastProgress=0,activeIndex=-1,pendingSeek=null,seekBusy=false,seekWatchdog=0;
    function paintScene(index){if(index===activeIndex)return;activeIndex=index;hud.classList.add("is-changing");window.setTimeout(()=>{const accent=scenes[index].accent||"",title=scenes[index].title,escaped=accent.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");document.querySelector("#kicker").textContent=scenes[index].n+" / CAPÍTULO";document.querySelector("#title").innerHTML=accent?title.replace(new RegExp(escaped+"$"),'<em class="title-accent">'+accent+'</em>'):'<span class="title-rest">'+title+'</span>';document.querySelector("#copy").textContent=scenes[index].copy;document.querySelector("#counter").textContent=scenes[index].n+" — 04";hud.classList.remove("is-changing")},180)}
    function requestSeek(target){if(reduceMotion||visual.classList.contains("video-unavailable")||!Number.isFinite(video.duration)||video.duration<=0)return;pendingSeek=Math.max(0,Math.min(video.duration-.04,target));if(!seekBusy)performSeek()}
    function performSeek(){if(pendingSeek===null||seekBusy)return;const target=pendingSeek;pendingSeek=null;if(Math.abs(video.currentTime-target)<.16)return;seekBusy=true;try{video.currentTime=target}catch{seekBusy=false;return}clearTimeout(seekWatchdog);seekWatchdog=window.setTimeout(()=>{seekBusy=false;performSeek()},180)}
    function update(){raf=0;const rect=journey.getBoundingClientRect(),range=Math.max(journey.offsetHeight-innerHeight,1),progress=Math.min(1,Math.max(0,-rect.top/range)),index=Math.min(scenes.length-1,Math.floor(progress*scenes.length));lastProgress=progress;paintScene(index);document.querySelector("#progress").style.transform="scaleX("+progress+")";requestSeek(progress*video.duration)}
    function queueUpdate(){if(!raf)raf=requestAnimationFrame(update)}
    addEventListener("scroll",queueUpdate,{passive:true});addEventListener("resize",queueUpdate);video.addEventListener("seeked",()=>{clearTimeout(seekWatchdog);seekBusy=false;performSeek()});video.addEventListener("loadedmetadata",()=>{requestSeek(lastProgress*video.duration)});video.addEventListener("error",()=>{visual.classList.add("video-unavailable");video.removeAttribute("src");video.querySelectorAll("source").forEach(source=>source.removeAttribute("src"));document.querySelector("#kicker").textContent="MÍDIA INDISPONÍVEL / PÔSTER";document.querySelector("#title").textContent="Lume continua em cena.";document.querySelector("#copy").textContent="A imagem de abertura da performance permanece como cenário.";document.querySelector("#counter").textContent="PÔSTER";document.querySelector("#progress").style.display="none"},{once:true});update();
  </script>
</body>
</html>
